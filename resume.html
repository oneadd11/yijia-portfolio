<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Yi Jia resume for reliability engineering, failure analysis, and validation roles.">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
    <title>Resume | Yi Jia Portfolio</title>
    <script type="module" src="./script.js?v=4"></script>
  </head>
  <body class="resume-page" data-page="resume">
    <a class="skip-link" href="#resume-viewer">Skip to resume</a>
    <header class="site-nav" data-site-nav>
      <div class="nav-inner">
        <a class="brand" href="./index.html#overview" aria-label="Kaia home"><img class="brand-image" src="./assets/brand/logos/owl-front-logo.png" alt="" aria-hidden="true"></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span class="menu-symbol" aria-hidden="true">Menu</span></button>
        <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
          <a href="./index.html#overview">Overview</a>
          <a href="./index.html#cases">Case Studies</a>
          <a href="./index.html#capabilities">Capabilities</a>
          <a href="./index.html#journey">Career Journey</a>
          <a href="./index.html#contact">Contact</a>
        </nav>
      </div>
    </header>
    <main class="resume-shell">
      <header class="resume-header" aria-label="Resume actions">
        <a class="resume-download-button" href="./resume.pdf" download>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3.75v10.5" />
            <path d="m7.75 10.25 4.25 4 4.25-4" />
            <path d="M5.25 18.75h13.5" />
          </svg>
          <span>Download</span>
        </a>
      </header>
      <section id="resume-viewer" class="resume-viewer-wrap" aria-label="Resume preview">
        <img
          class="resume-preview-image"
          src="./public/resume-preview-900.png"
          srcset="./public/resume-preview-900.png 900w, ./public/resume-preview-1400.png 1400w, ./public/resume-preview-1800.png 1800w"
          sizes="(max-width: 760px) calc(100vw - 16px), 880px"
          alt="Preview of Yi Jia resume"
        >
      </section>
    </main>
  </body>
</html>
