<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Yi Jia resume for reliability engineering, failure analysis, and validation roles.">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
    <title>Resume | Yi Jia Portfolio</title>
  </head>
  <body class="resume-page">
    <a class="skip-link" href="#resume-viewer">Skip to resume</a>
    <main class="resume-shell">
      <header class="resume-header" aria-label="Resume actions">
        <a class="resume-download-button" href="./resume.pdf" download>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3.75v10.5" />
            <path d="m7.75 10.25 4.25 4 4.25-4" />
            <path d="M5.25 18.75h13.5" />
          </svg>
          <span>Download</span>
        </a>
      </header>
      <section id="resume-viewer" class="resume-viewer-wrap" aria-label="Resume preview">
        <img class="resume-preview-image" src="./public/resume-preview.webp" alt="Preview of Yi Jia resume">
      </section>
    </main>
  </body>
</html>
